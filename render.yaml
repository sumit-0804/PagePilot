# Render Blueprint for the PagePilot API. Secrets use sync: false, so Render asks for them on first deploy.
services:
  - type: web
    name: pagepilot-api
    runtime: docker
    plan: free
    region: singapore # closest to the Supabase database in ap-south-1
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Liveness only: startup already fails without the database and storage, and a readiness check
    # here would restart the instance during a short Supabase outage. /health/ready is for monitors.
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    domains:
      - api.pagepilot.sumit0804.space
    envVars:
      - key: FRONTEND_URL
        value: https://pagepilot.sumit0804.space
      - key: DATABASE_URL # Supabase session pooler connection string
        sync: false
      - key: SUPABASE_URL
        value: https://wfwdsqpqkaljvflagkfu.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: pdfs
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY # OCR; also the embeddings standby
        sync: false
      - key: GEMINI_FALLBACK_API_KEY # optional, another Google project; OCR uses it when the first key is out of quota
        sync: false
      # Embeddings: Cloudflare Workers AI (OpenAI-compatible). EMBEDDING_DIM must match the vector(1024) column.
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_BASE_URL
        value: https://api.cloudflare.com/client/v4/accounts/8abfc93b7b26bb6ecd712f858adc7929/ai/v1
      - key: EMBEDDING_API_KEY # Cloudflare token with the Workers AI template
        sync: false
      - key: EMBEDDING_MODEL
        value: "@cf/qwen/qwen3-embedding-0.6b"
      - key: EMBEDDING_DIM
        value: "1024"
      - key: EMBEDDING_BATCH_SIZE
        value: "100"
      - key: EMBEDDING_QUERY_PREFIX
        value: "Instruct: Given a student's question, retrieve passages from their study documents that answer it\\nQuery:"
      # Only used when EMBEDDING_PROVIDER=gemini (the standby): copy from your AI Studio rate-limit page.
      - key: EMBEDDING_RPM
        value: "100"
      - key: EMBEDDING_TPM
        value: "30000"
      - key: EMBEDDING_RPD
        value: "1000"
      # Observability: optional; the API runs without them.
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OCR_PROVIDER
        value: gemini
      - key: OCR_MODEL
        value: gemini-3.5-flash-lite
      - key: OCR_RPM
        sync: false
      - key: OCR_TPM
        sync: false
      - key: OCR_RPD
        sync: false
      - key: OCR_PAGES_PER_CALL
        value: "10"
      - key: OCR_MAX_PAGES
        value: "100"
      - key: WEB_SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      - key: WEB_SEARCH_MAX_RESULTS
        value: "5"
